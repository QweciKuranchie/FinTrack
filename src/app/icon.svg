<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0B4F4A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Teal App Icon Box -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Financial Chart Bars -->
  <g filter="url(#glow)">
    <rect x="110" y="270" width="56" height="130" rx="16" fill="#FFFFFF" opacity="0.9"/>
    <rect x="198" y="200" width="56" height="200" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="286" y="140" width="56" height="260" rx="16" fill="#FFFFFF"/>
  </g>

  <!-- Golden Trending Growth Arrow -->
  <g filter="url(#glow)">
    <path d="M110 320 Q 230 280, 370 140" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round"/>
    <path d="M310 135 L395 125 L385 210 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
